<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - TgImg Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Image Gallery</h1>
                <p class="text-slate-500 mt-1">Manage your uploaded images</p>
            </div>
            <div class="flex gap-4">
                <input type="password" id="api-key" placeholder="API Key (for deletion)" class="text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-48">
                <a href="/" class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 text-slate-600 font-medium hover:bg-slate-50">Back to Upload</a>
            </div>
        </div>

                <div class="p-4">
                    <p class="text-sm font-medium text-slate-700 truncate" title="{{ img.file_name }}">{{ img.file_name }}</p>
                    <p class="text-xs text-slate-400 mt-1">{{ img.uploaded_at|date:"M d, Y H:i" }}</p>
                    <div class="mt-3 flex gap-2">
                        <input type="text" readonly value="{{ request.scheme }}://{{ request.get_host }}/img/{{ img.short_id }}" class="flex-1 text-xs bg-slate-50 border border-slate-200 rounded px-2 py-1 text-slate-600" id="url-{{ img.short_id }}">
                        <button onclick="copyUrl('{{ img.short_id }}')" class="bg-indigo-50 text-indigo-600 px-2 py-1 rounded text-xs font-medium hover:bg-indigo-100">Copy</button>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-span-full text-center py-12">
                <p class="text-slate-500">No images uploaded yet.</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
                async function deleteImage(shortId) {
            if (!confirm('Are you sure you want to permanently delete this image from the server and Telegram?')) return;
            
            const apiKey = document.getElementById('api-key').value;
            const formData = new FormData();
            formData.append('api_key', apiKey);
            
            try {
                const res = await fetch(/api/delete/ + shortId + /, { 
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('card-' + shortId).remove();
                } else {
                    alert('Delete failed: ' + (data.error || 'Unknown error'));
                }
            } catch(e) {
                alert('Connection error.');
            }
        });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('card-' + shortId).remove();
                } else {
                    alert('Delete failed.');
                }
            } catch(e) {
                alert('Connection error.');
            }
        }

        function copyUrl(shortId) {
            const input = document.getElementById('url-' + shortId);
            input.select();
            document.execCommand('copy');
            alert('Copied!');
        }
    </script>
</body>
</html>
