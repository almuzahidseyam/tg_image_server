<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TgImg - Free Telegram Image Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">TgImg Server</h1>
                        <p class="text-slate-500 mt-2">Unlimited free image hosting powered by Telegram</p>
            
            <div class="mt-6 flex max-w-xs mx-auto">
                <input type="password" id="api-key" placeholder="Enter API Key (if required)" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center">
            </div>

            <a href="/gallery/" class="inline-block mt-4 text-sm font-medium text-indigo-600 hover:text-indigo-800">View Image Gallery &rarr;</a>
        </div>

                <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-colors">
            <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p class="mt-4 text-sm text-slate-600 font-medium">Click or drag images to upload (Multiple allowed)</p>
            <input type="file" id="file-input" class="hidden" accept="image/*,video/mp4,image/gif" multiple>
        </div>

        <div id="loading" class="hidden mt-6 text-center">
            <div class="animate-spin inline-block w-6 h-6 border-2 border-current border-t-transparent text-indigo-600 rounded-full" role="status"></div>
            <p id="loading-text" class="text-sm text-slate-500 mt-2">Uploading...</p>
        </div>

        <div id="result" class="hidden mt-6 space-y-3">
            <p class="text-sm font-semibold text-slate-700">Uploaded Links:</p>
            <div id="link-list" class="space-y-2"></div>
            <button onclick="resetUploader()" class="mt-4 w-full px-4 py-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-lg hover:bg-slate-200 transition">Upload More</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const urlOutput = document.getElementById('url-output');
        const preview = document.getElementById('preview');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
            if (e.dataTransfer.files.length) {
                handleUpload(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleUpload(e.target.files);
            }
        });

                async function handleUpload(files) {
            dropZone.style.display = 'none';
            loading.style.display = 'block';
            result.style.display = 'none';
            document.getElementById('link-list').innerHTML = '';

            let total = files.length;
            let current = 0;

            for (let i = 0; i < files.length; i++) {
                current++;
                document.getElementById('loading-text').innerText = 'Uploading ' + current + ' of ' + total + '...';
                
                                const formData = new FormData();
                formData.append('image', files[i]);
                formData.append('api_key', document.getElementById('api-key').value);

                try {
                    const res = await fetch('/api/upload/', { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.success) {
                        const div = document.createElement('div');
                        div.className = 'flex items-center gap-2';
                        div.innerHTML = 
                            <input type="text" readonly value=" + data.url + " class="flex-1 text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-600">
                            <a href=" + data.url + " target="_blank" class="px-3 py-2 bg-indigo-50 text-indigo-600 text-sm font-medium rounded-lg hover:bg-indigo-100 transition">View</a>
                        ;
                        document.getElementById('link-list').appendChild(div);
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            loading.style.display = 'none';
            result.style.display = 'block';
        }

        function resetUploader() {
            dropZone.style.display = 'block';
            result.style.display = 'none';
        }
    </script>
</body>
</html>
