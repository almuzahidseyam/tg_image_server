<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TgImg - Free Telegram Image Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">TgImg Server</h1>
            <p class="text-slate-500 mt-2">Unlimited free image hosting powered by Telegram</p>
        </div>

        <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-colors">
            <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p class="mt-4 text-sm text-slate-600 font-medium">Click or drag image to upload</p>
            <input type="file" id="file-input" class="hidden" accept="image/*">
        </div>

        <div id="loading" class="hidden mt-6 text-center">
            <div class="animate-spin inline-block w-6 h-6 border-2 border-current border-t-transparent text-indigo-600 rounded-full" role="status" aria-label="loading"></div>
            <p class="text-sm text-slate-500 mt-2">Uploading to Telegram...</p>
        </div>

        <div id="result" class="hidden mt-6">
            <p class="text-sm font-semibold text-slate-700 mb-2">Image URL:</p>
            <div class="flex items-center gap-2">
                <input type="text" id="url-output" readonly class="flex-1 text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="copyUrl()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition">Copy</button>
            </div>
            <img id="preview" src="" class="mt-4 rounded-lg w-full object-cover max-h-48 border border-slate-200 shadow-sm">
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const urlOutput = document.getElementById('url-output');
        const preview = document.getElementById('preview');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
            if (e.dataTransfer.files.length) {
                handleUpload(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleUpload(e.target.files[0]);
            }
        });

        async function handleUpload(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file.');
                return;
            }

            dropZone.style.display = 'none';
            loading.style.display = 'block';
            result.style.display = 'none';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch('/api/upload/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                if (data.success) {
                    urlOutput.value = data.url;
                    preview.src = data.url;
                    loading.style.display = 'none';
                    result.style.display = 'block';
                } else {
                    alert('Upload failed: ' + data.error);
                    dropZone.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (err) {
                alert('Server connection error.');
                dropZone.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        function copyUrl() {
            urlOutput.select();
            document.execCommand('copy');
            const btn = document.querySelector('button');
            const original = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = original, 2000);
        }
    </script>
</body>
</html>
